[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "linkedin-cli"
dynamic = ["version"]
description = "Django-free library and CLI for LinkedIn platform mechanics over a bound browser session (Voyager API + Playwright)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "eracle", email = "eracle@posteo.eu" }]
keywords = [
    "linkedin", "linkedin-api", "linkedin-automation", "linkedin-scraper",
    "voyager", "playwright", "browser-automation", "web-scraping", "cli",
    "outreach", "lead-generation", "ai-agent", "llm", "agent-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "playwright>=1.59",
    "playwright-stealth",
    "tenacity>=8,<10",
    "termcolor",
]

[project.urls]
Homepage = "https://github.com/darwincr/linkedin-cli"
Repository = "https://github.com/darwincr/linkedin-cli"
Issues = "https://github.com/darwincr/linkedin-cli/issues"

[project.scripts]
linkedin-cli = "linkedin_cli.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_cli"]
